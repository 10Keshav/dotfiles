[mgr]
show_hidden = true
ratio = [2,5,3]
linemode = "size"

[opener]
play = [
	{ run = 'mpv %s', orphan = true, for = "unix" },
	# { run = '"C:\Program Files\mpv.exe" %*', orphan = true, for = "windows" }
]
edit = [
	{ run = '$EDITOR %s', block = true, for = "unix" },
]
open = [
  { run = 'xdg-open %s', desc = "Open" },
	# { run = 'xdg-open %s', desc = "Open" },
]
img = [
	{ run = 'qimgv %s', desc = "Open" },
]
loffice = [
  { run = 'loffice %s', desc = "Open"}
]

[open]
rules = [
	{ mime = "text/*", use = "edit" },
	{ mime = "video/*", use = "play" },
	{ mime = "image/*", use = "img" },
	# { mime = "application/pdf", use = "open" },
	{ mime = "application/*", use = "open" },

	# { mime = "application/json", use = "edit" },
	# { name = "*.pdf", use = "open" },
]

[[plugin.prepend_fetchers]]
id  = "git"
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
id  = "git"
url = "*/"
run = "git"
group = "git"
