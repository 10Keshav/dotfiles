# ~/.config/tmux/tmux.conf for tmux 3.8
# Made with https://tmux.app/config-generator/
# Edit this config: https://tmux.app/config-generator/#file=xdg&defs=comment&pfx=%60&pfx2=1&keys=vi&vsel=1&split=pipes&resize=1&sstyle=dark&sright=host&blines=double&bact=blue&activity=1
# Apply changes: tmux source-file ~/.config/tmux/tmux.conf  (or Prefix + r)

# ── Prefix key ────────────────────────────────────────────────────────
# Use ` as the prefix instead of Ctrl+b (Ctrl+b keeps working as a second prefix)
set -g prefix '`'
set -g prefix2 C-b
# Press ` twice to send it to the program inside the pane
bind '`' send-prefix

# ── General ───────────────────────────────────────────────────────────
# Mouse: click to select panes and windows, drag borders to resize, wheel scrolls
# Already the default on tmux 3.8:
# set -g mouse on
# Number windows and panes from 1, so the first window is Prefix + 1
set -g base-index 1
setw -g pane-base-index 1
# Renumber windows when one is closed (no gaps such as 1 2 4)
set -g renumber-windows on
# Lines of scrollback kept per pane (applies to panes created after this is set)
set -g history-limit 50000
# Wait only 10 ms after Esc, so Vim and Neovim react at once
# Already the default on tmux 3.8 (it was 500 before 3.5):
# set -s escape-time 10
# Show messages for 2 seconds instead of 0.75
set -g display-time 2000
# Pass focus events to programs (Vim autoread, editors that save on blur)
set -s focus-events on
# Mark windows with new output in the status line
setw -g monitor-activity on
# Prefix + r reloads this file
bind r source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded"

# ── Copy mode and clipboard ───────────────────────────────────────────
# vi keys in copy mode (h/j/k/l, /, ?, w, b ...)
setw -g mode-keys vi
# Vim-like selection: v starts, Ctrl+v toggles block mode, y copies and exits
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
# Copies are sent to your terminal's clipboard with OSC 52 when it supports it
# Already the default:
# set -s set-clipboard external

# ── Panes and windows ─────────────────────────────────────────────────
# Prefix + | splits left/right and Prefix + - splits top/bottom, in the current directory
# (- replaces the default delete-buffer key; % and " keep working)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
# New windows open in the current directory too
bind c new-window -c "#{pane_current_path}"
# Prefix + H/J/K/L resizes the pane by 5 cells; hold the letter to repeat
# (L replaces switch-client -l)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Status line ───────────────────────────────────────────────────────
# Redraw the status line every 5 seconds (default 15)
set -g status-interval 5
# Status line colors, with the current window highlighted
set -g status-style "bg=#1e2030,fg=#c0caf5"
setw -g window-status-style "fg=#c0caf5"
setw -g window-status-current-style "bg=#7aa2f7,fg=#1e2030,bold"
setw -g window-status-format " #I:#W#{?window_flags,#{window_flags},} "
setw -g window-status-current-format " #I:#W#{?window_flags,#{window_flags},} "
setw -g window-status-separator ""
# Right: host name and time
set -g status-right " %H:%M "
set -g status-right-length 50
set -g status-left-length 50

# ── Pane borders ──────────────────────────────────────────────────────
# Active pane border color (still yellow in copy mode and red when panes are synchronized)
setw -g pane-active-border-style "#{?pane_in_mode,fg=yellow,#{?synchronize-panes,fg=red,fg=#7aa2f7}}"

# ── Colors and terminal ───────────────────────────────────────────────
# tmux 3.8 picks a light or dark theme from your terminal's background
# Already the default:
# set -s theme detect
# TERM inside tmux: italics and 256 colors
# Already the default when the tmux-256color terminfo entry exists:
# set -g default-terminal "tmux-256color"
# 24-bit true color when the outer terminal's TERM is xterm-256color (3.6+ also detects COLORTERM=truecolor)
set -as terminal-features ",xterm-256color:RGB"
# set-hook -g session-created 'split-window -h -p 35'
